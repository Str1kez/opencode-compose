# The default for setups without the wizard. The wizard writes COMPOSE_PROJECT_NAME to .env,
# one per repository, so two repositories run side by side (ADR 0002); it overrides this.
name: opencode

services:
  opencode:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        UV_PIP_INDEX_URL: ${UV_PIP_INDEX_URL:-https://pypi.org/simple}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
        INSTALL_UV: ${INSTALL_UV:-0}
        OPENCODE_UID: ${OPENCODE_UID:-1000}
        OPENCODE_GID: ${OPENCODE_GID:-1000}
    # Per project: repositories with different toolchains don't retag each other's image.
    image: opencode-server:${COMPOSE_PROJECT_NAME}
    init: true
    restart: unless-stopped
    # The process is non-root from its first instruction, so it never had effective
    # capabilities: dropping them changes nothing for socat (ports below 1024 never worked
    # as non-root) and nothing calls chown or setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Threads count as pids; the limit leaves room for builds and test runs of the agent.
    pids_limit: 1024
    # Longer than STOP_TIMEOUT in docker/entrypoint.sh (10s), or Docker SIGKILLs the
    # entrypoint before it exits with 143.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      # Lets `docker compose exec opencode opencode ... --server http://127.0.0.1:4096`
      # authenticate against the server above.
      OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_UPDATE_HOUR: ${OPENCODE_UPDATE_HOUR:-4}
      # Updates are handled by opencode-update; the built-in updater must not race it.
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      TZ: ${TZ:-Europe/Moscow}
      HOST_LOOPBACK_PORTS: ${HOST_LOOPBACK_PORTS:-}
      # The wizard points git at the mounted key and known_hosts (see docker-compose.override.yml).
      # An env var instead of core.sshCommand: the host .gitconfig is mounted read-only and
      # its include/includeIf targets may not exist in the container.
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-ssh}
    # The repository is mounted at the same absolute path as on the host, so session
    # directories match between the host CLI and the server.
    working_dir: ${WORKSPACE:?set WORKSPACE in .env}
    volumes:
      - type: bind
        source: ${WORKSPACE:?set WORKSPACE in .env}
        target: ${WORKSPACE:?set WORKSPACE in .env}
        bind:
          create_host_path: false
      # The container's own .venv of every python project (ADR 0003) is a volume per project,
      # mounted over the host .venv by docker-compose.override.yml, which the wizard writes
      # together with the VENV_MOUNT_POINTS build arg.
      - type: volume
        source: opencode-home
        target: /home/opencode
      - type: bind
        source: ${HOST_OPENCODE_CONFIG:-${HOME}/.config/opencode}
        target: /home/opencode/.config/opencode
        read_only: true
        bind:
          create_host_path: false
      # create_host_path: false makes a missing file fail loudly instead of Docker
      # silently creating a directory in its place on the host.
      - type: bind
        source: ${HOST_GITCONFIG:-${HOME}/.gitconfig}
        target: /home/opencode/.gitconfig
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4096/"]
      interval: 30s
      timeout: 5s
      # The first start downloads opencode, which can take minutes on a slow corporate network.
      start_period: 300s
      retries: 3

volumes:
  # The wizard derives HOME_VOLUME per repository from WORKSPACE: the agent can write here
  # (the opencode binary, ~/.local/bin), so a home shared between repositories lets an agent
  # in one plant code that runs in another. The fallback below is the old shared home, for
  # setups without the wizard; set HOME_VOLUME=opencode_opencode-home to opt in on purpose.
  opencode-home:
    name: ${HOME_VOLUME:-opencode_opencode-home}
